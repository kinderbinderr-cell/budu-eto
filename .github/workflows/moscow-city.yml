name: Update Moscow city averages
on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: moscow-shelves
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read official Moscow observations
        run: |
          base=.github/price-refresh/scripts
          curl --fail --silent --show-error --retry 2 --max-time 35 --cacert .github/reminders/server.pem https://www.kbrcore.ru:8443/budu-eto/moscow-city-observations -o "$RUNNER_TEMP/city.json"
          python3 "$base/regional-city-prices.py" publish "$RUNNER_TEMP/city.json" city-prices.js
      - name: Publish changed observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- city-prices.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- city-prices.js
          git commit -m "Update Moscow city price observations"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null
