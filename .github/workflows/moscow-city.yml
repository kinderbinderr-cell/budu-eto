name: Update Moscow city averages
on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: moscow-shelves
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read official Moscow observations
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y poppler-utils; fi
          python3 .github/price-refresh/scripts/city-prices.py city-prices.js
      - name: Publish changed observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- city-prices.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- city-prices.js
          git commit -m "Update Moscow city price observations"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null
