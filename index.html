    <script>
      // Read Telegram's launch fragment before the planner starts using hash navigation.
      const miniLaunch = new URLSearchParams(location.search).get("mini") === "1" ||
        /(?:^#|&)tgWebApp(?:Data|Version|Platform)=/.test(location.hash);
      let loadTelegram = miniLaunch;
      try {
        if (miniLaunch) sessionStorage.setItem("tg-launch","1");
        loadTelegram ||= sessionStorage.getItem("tg-launch") === "1";
      } catch {}
      if (loadTelegram) document.write('<script src="https://telegram.org/js/telegram-web-app.js?65"><\/script>');
    </script>
